<!--
There's plenty of time to be dead
-->

<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 512 50'
>

<defs>
  <style><![CDATA[
    :root {
      color-scheme: light dark;
      --path-text-color: #111827;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --path-text-color: #f3f4f6;
      }
    }

    .path-text {
      font-size: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: bold;
      white-space: nowrap;
      fill: var(--path-text-color);
      letter-spacing: normal;
      dominant-baseline: middle;
      text-anchor: start;
    }
  ]]></style>
</defs>


                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s'
                    dur='6000ms' fill='freeze'
                    values='m0,25 h0 ; m0,25 h512 ; m0,25 h512 ; m0,25 h512' keyTimes='0;0.66666666666667;0.83333333333333;1' />
                    </path>
    <text class="path-text" x="0%">
        <textPath xlink:href='#path0'>
            There's plenty of time to be dead
        </textPath>
    </text>
</svg>
